<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Product Catalogue</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg:#F4F3EF; --card:#FFFFFF; --ink:#1B1E22; --muted:#6C737E; --line:#E4E2DB; --shade:#F8F7F4;
    --accent:#167C6C; --accent-soft:#E2F1ED; --accent-ink:#0E5A4E;
    --good:#2A9D6B; --good-soft:#E3F5EC; --warn:#D9822B; --warn-soft:#FBEEDD; --bad:#D14343; --bad-soft:#FBE5E5;
    --shadow:0 1px 2px rgba(20,24,28,.05), 0 8px 24px -16px rgba(20,24,28,.25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#15181C; --card:#1D2126; --ink:#E8E9E5; --muted:#8E949E; --line:#2C3138; --shade:#1A1E23;
      --accent:#43B79E; --accent-soft:#1D3A34; --accent-ink:#8FDCC9;
      --good:#4CC28A; --good-soft:#1B3328; --warn:#E8A050; --warn-soft:#3A2B18; --bad:#EE6B6B; --bad-soft:#3B2022;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.6);
    }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.45 Manrope,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
  .mono { font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums; }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  header.app { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .bar { max-width:1500px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .brand { display:flex; align-items:baseline; gap:10px; }
  .brand h1 { font-size:19px; margin:0; font-weight:800; letter-spacing:-.02em; }
  .brand span { font-size:12px; color:var(--muted); }
  nav.tabs { display:flex; gap:2px; background:var(--shade); border:1px solid var(--line); border-radius:10px; padding:3px; margin-left:auto; }
  nav.tabs button { border:0; background:transparent; padding:7px 13px; border-radius:8px; font-weight:600; color:var(--muted); display:flex; gap:7px; align-items:center; }
  nav.tabs button .n { font-size:11px; font-weight:600; }
  nav.tabs button.on { background:var(--card); color:var(--ink); box-shadow:var(--shadow); }
  nav.tabs button.on .n { color:var(--accent-ink); }

  main { max-width:1500px; margin:0 auto; padding:16px 20px 40px; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar input[type=search] { flex:1 1 220px; max-width:360px; border:1px solid var(--line); border-radius:9px; padding:8px 12px; background:var(--card); color:inherit; font:inherit; }
  .seg { display:flex; gap:4px; flex-wrap:wrap; }
  .seg button { border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px; padding:5px 11px; font-size:13px; font-weight:600; }
  .seg button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .seg button .n { font-size:11px; opacity:.7; margin-left:4px; }
  .count { font-size:13px; color:var(--muted); margin:0 0 10px; }

  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(178px, 1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; transition:transform .15s, box-shadow .15s; text-align:left; padding:0; }
  .card:hover { transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--accent); }
  .card .im { aspect-ratio:1; background:#fff; display:flex; align-items:center; justify-content:center; padding:14px; position:relative; }
  .card .im img { max-width:100%; max-height:100%; object-fit:contain; }
  .chip { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap; }
  .chip.up { background:var(--good-soft); color:var(--good); } .chip.flat { background:var(--shade); color:var(--muted); }
  .card .badge { position:absolute; top:8px; left:8px; }
  .card .im .qty { position:absolute; right:8px; bottom:8px; font-size:11px; font-weight:700; background:var(--ink); color:var(--bg); padding:2px 7px; border-radius:999px; }
  .card .meta { padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; }
  .card .sku { font-weight:700; font-size:13px; } .card .tp { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .card .sp { height:22px; margin-top:4px; }
  .g { color:var(--good); } .o { color:var(--warn); } .r { color:var(--bad); }
  .more { grid-column:1/-1; text-align:center; padding:10px; }
  .btn { border:1px solid var(--line); background:var(--card); border-radius:9px; padding:8px 12px; font-weight:700; }
  .empty { color:var(--muted); padding:30px 0; text-align:center; }

  .modal { position:fixed; inset:0; background:rgba(15,18,20,.55); display:none; align-items:center; justify-content:center; padding:20px; z-index:40; }
  .modal.on { display:flex; }
  .sheet { background:var(--card); border-radius:16px; max-width:760px; width:100%; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); overflow:hidden; box-shadow:var(--shadow); }
  @media (max-width:640px){ .sheet { grid-template-columns:1fr; } }
  .sheet .big { background:#fff; display:flex; align-items:center; justify-content:center; padding:24px; min-height:280px; }
  .sheet .big img { max-width:100%; max-height:360px; object-fit:contain; }
  .sheet .info { padding:20px; display:flex; flex-direction:column; gap:12px; }
  .sheet .info h3 { margin:0; font-size:22px; letter-spacing:-.02em; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14px; }
  .kv .k { color:var(--muted); }
  footer { max-width:1500px; margin:0 auto; padding:0 20px 40px; color:var(--muted); font-size:12px; }
  @media (prefers-reduced-motion: reduce) { .card { transition:none; } }
  @media (max-width:640px) { .bar { padding:10px 12px; } main { padding:12px; } nav.tabs { margin-left:0; width:100%; } nav.tabs button { flex:1; justify-content:center; } }
</style>
</head>
<body>
<header class="app"><div class="bar">
  <div class="brand"><h1>Product Catalogue</h1><span id="count">—</span></div>
  <nav class="tabs" id="brands"></nav>
</div></header>

<main>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search SKU…" autocomplete="off">
    <div class="seg" id="sort"><button class="on" data-s="sold">Best sellers</button><button data-s="sku">By SKU</button><button data-s="stock">Low stock first</button></div>
  </div>
  <div class="toolbar">
    <div class="seg" id="types"></div>
  </div>
  <div class="toolbar" id="stockbar" hidden>
    <div class="seg" id="stockchips"></div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="empty" id="empty" hidden>Nothing matches that search.</div>
</main>
<footer id="foot"></footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

  if (sort === "sold") list.sort((a, b) => (b.q30 || 0) - (a.q30 || 0) || a.sku.localeCompare(b.sku));
  if (sort === "sku") list.sort((a, b) => a.sku.localeCompare(b.sku));
  if (sort === "stock") list.sort((a, b) => (a.c && a.c !== "n" ? (a.d ?? kiekis(a)) : 1e9) - (b.c && b.c !== "n" ? (b.d ?? kiekis(b)) : 1e9));
  return list;
}
function render() {
  const list = visible();
  $("#empty").hidden = list.length > 0;
  $("#count").textContent = list.length === items.length ? `${items.length} products` : `${list.length} of ${items.length} products`;
  const slice = list.slice(0, shown);
  $("#cards").innerHTML = slice.map(p => {
    const counted = p.c && p.c !== "n";
    const stockTxt = !counted ? "" : kiekis(p) <= 0 ? ` · <span class="r">out of stock</span>` : ` · <span class="${p.c}">${kiekis(p)} ${STOCK_LABELS[p.c] || ""}</span>`;
    return `<button class="card" data-sku="${p.sku}"><div class="im"><img loading="lazy" decoding="async" src="${thumb(p)}" alt="${p.sku}" onerror="this.remove()">${p.t === "hot" ? `<span class="badge chip up">🔥 selling fast</span>` : p.t === "slow" ? `<span class="badge chip flat">💤 not moving</span>` : ""}${p.q30 ? `<span class="qty">${p.q30} sold · 30 d</span>` : ""}</div><div class="meta"><span class="sku mono">${p.sku}</span><span class="tp">${TIPAI[p.tipas] || p.tipas}${stockTxt}</span><div class="sp">${spark(p.sp || zeros)}</div></div></button>`;
  }).join("") + (list.length > shown ? `<div class="more"><button class="btn" id="more">Show ${Math.min(120, list.length - shown)} more of ${list.length}</button></div>` : "");
}
function openModal(p) {
  const counted = p.c && p.c !== "n";
  $("#sheet").innerHTML = `<div class="big"><img src="${full(p)}" alt="${p.sku}" onerror="this.src='${thumb(p)}'"></div><div class="info"><h3 class="mono">${p.sku}</h3><span style="color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:12px">${TIPAI[p.tipas] || p.tipas}${p.t === "hot" ? " · 🔥 selling fast" : p.t === "slow" ? " · 💤 not moving" : ""}</span><div class="kv"><span class="k">Sold 30 d</span><b class="mono">${p.q30 || 0}</b><span class="k">Sold 7 d</span><b class="mono">${p.q7 || 0}</b><span class="k">In stock</span><b class="mono ${counted ? p.c : ""}">${counted ? (kiekis(p) <= 0 ? "out of stock" : kiekis(p)) : "not counted"}</b>${p.d != null ? `<span class="k">Days of cover</span><b class="mono">${p.d} d</b>` : ""}${p.inc ? `<span class="k">On the way</span><b class="mono">${p.inc}</b>` : ""}</div><div><div style="font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.06em">LAST 30 DAYS</div>${spark(p.sp || zeros, 300, 40)}</div><div style="display:flex;gap:8px;margin-top:auto"><button class="btn" id="close">Close</button></div></div>`;
  $("#modal").classList.add("on");
}

$("#sort").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; sort = b.dataset.s; $("#sort").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); shown = 120; render(); });
$("#types").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; kat = b.dataset.t; shown = 120; renderTypes(); render(); });
$("#stockchips").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; stockFilter = b.dataset.f; shown = 120; renderStock(); render(); });
$("#q").addEventListener("input", e => { query = e.target.value; shown = 120; render(); });
$("#cards").addEventListener("click", e => { if (e.target.id === "more") { shown += 120; render(); return; } const b = e.target.closest(".card"); if (!b) return; const p = items.find(x => x.sku === b.dataset.sku); if (p) openModal(p); });
$("#modal").addEventListener("click", e => { if (e.target.id === "modal" || e.target.id === "close") $("#modal").classList.remove("on"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#modal").classList.remove("on"); });

renderBrands(); renderTypes(); renderStock(); render();
$("#foot").textContent = turimStock ? "Stock and sales are written in when the page is published and refreshed every day." : "";
</script>
</body>
</html>
