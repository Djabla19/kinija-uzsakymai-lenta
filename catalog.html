<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Catalogue</title>
<style>
  :root {
    --bg:#eef1f5; --card:#fff; --ink:#1f2733; --muted:#8a94a6; --line:#e7ebf1;
    --accent:#4f6bed; --accent-soft:#eaeeff; --shade:#f4f6fa;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1a1f27; --ink:#e7ecf3; --muted:#8d97a8;
            --line:#262d38; --accent:#7b90ff; --accent-soft:#232a3d; --shade:#141920; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; }
  body {
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.4;
    font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
    padding:20px 16px 60px;
  }
  .wrap { max-width:1500px; margin:0 auto; }

  .top { display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:14px; }
  h1 { font-size:24px; margin:0; letter-spacing:-.3px; }
  .sub { color:var(--muted); font-size:13px; margin-top:4px; }

  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:18px 0 16px; }
  input[type=search] {
    font:inherit; color:inherit; border-radius:9px; border:1px solid var(--line);
    background:var(--card); padding:9px 12px; outline:none;
    min-width:210px; flex:1 1 210px; max-width:340px;
  }
  input[type=search]:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--muted);
          border-radius:20px; padding:6px 13px; font-size:13px; cursor:pointer; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  /* The brand switch is a bigger decision than a filter — it changes which
     catalogue you are looking at, so it reads heavier than the chips below. */
  #brandchips .chip { font-weight:600; padding:8px 15px; font-size:14px; }
  .chip u { font-style:normal; text-decoration:none; opacity:.7; margin-left:5px; }

  /* ---- grid ----
     Fixed square tiles: supplier photos come in every shape, so each one is
     cropped to a square when uploaded and the grid stays even. */
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); }
  .item { background:var(--card); border:1px solid var(--line); border-radius:14px;
          overflow:hidden; cursor:zoom-in; }
  .item:hover { border-color:var(--accent); }
  .ph { position:relative; width:100%; aspect-ratio:1/1; background:var(--shade); }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .cap { padding:9px 11px 11px; }
  .cap b { display:block; font-size:14px; font-weight:600; letter-spacing:.2px;
           font-family:ui-monospace,Menlo,Consolas,monospace; }
  .cap span { display:block; font-size:11px; color:var(--muted); margin-top:2px;
              text-transform:uppercase; letter-spacing:.5px; }

  /* ---- stock ----
     Green / amber / red is not about the size of the number but about how
     long it will last at the current selling speed — 200 pieces is red if
     twenty go out every day. Same rule as the orders board, so a colour
     never means two different things in two places. */
  /* Above the photo, not under the name: the first thing anyone asks of this
     page is "do we have it", so the answer sits where the eye lands first. */
  /* Fixed height: a tile showing a number and a tile showing a dash have to
     line up, or the whole grid goes half a step out of step. */
  .stock { display:flex; align-items:center; gap:6px; height:32px;
           font-size:12px; font-weight:600;
           padding:0 11px; border-bottom:1px solid var(--line); }
  .stock i { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
  /* How it sells, at the right end of the same bar — a mark, never a number:
     the shelf count is the colleague's business, our turnover is not. */
  .stock em { margin-left:auto; font-style:normal; font-size:11px; letter-spacing:.3px; }
  .stock em.hot  { color:#d13a3f; }
  .stock em.slow { color:var(--muted); }
  .stock b { font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; }
  .stock u { font-weight:400; text-decoration:none; color:var(--muted);
             text-transform:uppercase; letter-spacing:.4px; font-size:10px; }
  .stock.g { color:#1a9c53; } .stock.g i { background:#2ecc71; }
  .stock.o { color:#c47f00; } .stock.o i { background:#f5a623; }
  .stock.r { color:#d13a3f; } .stock.r i { background:#e5484d; }
  .stock.n { color:var(--muted); }
  @media (prefers-color-scheme: dark) {
    .stock.g { color:#41d47f; } .stock.o { color:#ffb84d; } .stock.r { color:#ff6b6f; }
  }
  .lb figcaption .stock { justify-content:center; color:#fff; border:0; margin-top:6px; }
  .empty { padding:60px 20px; text-align:center; color:var(--muted); }

  /* ---- lightbox ---- */
  .lb { position:fixed; inset:0; background:rgba(10,13,18,.88); display:none;
        align-items:center; justify-content:center; padding:24px; z-index:50; cursor:zoom-out; }
  .lb.on { display:flex; }
  .lb figure { margin:0; max-width:min(900px, 100%); text-align:center; }
  .lb img { max-width:100%; max-height:78vh; border-radius:14px; display:block; background:#fff; }
  .lb figcaption { color:#fff; margin-top:14px; font-size:16px; font-weight:600;
                   font-family:ui-monospace,Menlo,Consolas,monospace; }
  .lb figcaption em { display:block; font-style:normal; font-weight:400; font-size:12px;
                      opacity:.7; margin-top:4px; text-transform:uppercase; letter-spacing:.6px; }

  @media (max-width:560px) {
    .grid { grid-template-columns:repeat(auto-fill, minmax(132px, 1fr)); gap:10px; }
    h1 { font-size:20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Product Catalogue</h1>
      <div class="sub" id="count">—</div>
    </div>
  </div>

  <div class="bar" id="brandbar" hidden>
    <div class="chips" id="brandchips"></div>
  </div>
  <div class="bar">
    <input type="search" id="q" placeholder="Search SKU…" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
  <div class="bar" id="stockbar" hidden>
    <div class="chips" id="stockchips"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Nothing matches that search.</div>
</div>

<div class="lb" id="lb"><figure><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption></figure></div>

ipas":"necklaces","f":"NECKFREEHAND","k":"pandora"},{"sku":"neck herbarium","tipas":"necklaces","f":"NECKHERBARIUM","k":"pandora"},{"sku":"neck maple","tipas":"necklaces","f":"NECKMAPLE","k":"pandora"},{"sku":"neck medium pendant","tipas":"necklaces","f":"NECKMEDIUMPENDANT","k":"pandora"},{"sku":"neck moments","tipas":"necklaces","f":"NECKMOMENTS","k":"pandora","t":"hot"},{"sku":"neck moon","tipas":"necklaces","f":"NECKMOON","k":"pandora"},{"sku":"neck oval","tipas":"necklaces","f":"NECKOVAL","k":"pandora"},{"sku":"neck ratas","tipas":"necklaces","f":"NECKRATAS","k":"pandora"},{"sku":"neck signature","tipas":"necklaces","f":"NECKSIGNATURE","k":"pandora"},{"sku":"neck sirdis","tipas":"necklaces","f":"NECKSIRDIS","k":"pandora"},{"sku":"neck small pendant","tipas":"necklaces","f":"NECKSMALLPENDANT","k":"pandora"},{"sku":"neck spinning","tipas":"other","f":"NECKSPINNING","k":"pandora"},{"sku":"neck square","tipas":"necklaces","f":"NECKSQUARE","k":"pandora"},{"sku":"neck star","tipas":"necklaces","f":"NECKSTAR","k":"pandora"},{"sku":"neck t bar","tipas":"necklaces","f":"NECKTBAR","k":"pandora"},{"sku":"neck twoheart","tipas":"necklaces","f":"NECKTWOHEART","k":"pandora"},{"sku":"neck wing","tipas":"necklaces","f":"NECKWING","k":"pandora"},{"sku":"necklace curb","tipas":"necklaces","f":"NECKLACECURB","k":"pandora"},{"sku":"november","tipas":"other","f":"NOVEMBER","k":"pandora"},{"sku":"october","tipas":"other","f":"OCTOBER","k":"pandora"},{"sku":"pluto","tipas":"other","f":"PLUTO","k":"pandora"},{"sku":"polished clip 791752","tipas":"charms","f":"POLISHEDCLIP791752","k":"pandora"},{"sku":"puppy 798009EN16","tipas":"charms","f":"PUPPY798009EN16","k":"pandora"},{"sku":"r2d2","tipas":"other","f":"R2D2","k":"pandora"},{"sku":"reactor","tipas":"charms","f":"REACTOR","k":"pandora"},{"sku":"ring band","tipas":"rings","f":"RINGBAND","k":"pandora"},{"sku":"ring beaded 190615","tipas":"rings","f":"RINGBEADED190615","k":"pandora"},{"sku":"ring celestial","tipas":"rings","f":"RINGCELESTIAL","k":"pandora"},{"sku":"ring elegance","tipas":"rings","f":"RINGELEGANCE","k":"pandora"},{"sku":"ring heart","tipas":"rings","f":"RINGHEART","k":"pandora"},{"sku":"ring lines","tipas":"rings","f":"RINGLINES","k":"pandora"},{"sku":"ring love","tipas":"rings","f":"RINGLOVE","k":"pandora"},{"sku":"ring open heart","tipas":"rings","f":"RINGOPENHEART","k":"pandora"},{"sku":"ring rose","tipas":"rings","f":"RINGROSE","k":"pandora"},{"sku":"ring slim","tipas":"rings","f":"RINGSLIM","k":"pandora"},{"sku":"ring solitaire","tipas":"rings","f":"RINGSOLITAIRE","k":"pandora"},{"sku":"ring sparkling","tipas":"rings","f":"RINGSPARKLING","k":"pandora"},{"sku":"ring statement","tipas":"rings","f":"RINGSTATEMENT","k":"pandora"},{"sku":"ring tiara","tipas":"rings","f":"RINGTIARA","k":"pandora"},{"sku":"ring twisted","tipas":"rings","f":"RINGTWISTED","k":"pandora"},{"sku":"ring wishbone","tipas":"rings","f":"RINGWISHBONE","k":"pandora"},{"sku":"september","tipas":"other","f":"SEPTEMBER","k":"pandora"},{"sku":"sf clip","tipas":"safety","f":"SFCLIP","k":"pandora","t":"hot"},{"sku":"sf embossed","tipas":"safety","f":"SFEMBOSSED","k":"pandora"},{"sku":"sf family ties","tipas":"safety","f":"SFFAMILYTIES","k":"pandora"},{"sku":"sf fly","tipas":"safety","f":"SFFLY","k":"pandora"},{"sku":"sf love","tipas":"safety","f":"SFLOVE","k":"pandora"},{"sku":"sf mickey","tipas":"safety","f":"SFMICKEY","k":"pandora"},{"sku":"sf pave","tipas":"safety","f":"SFPAVE","k":"pandora"},{"sku":"sliding beads","tipas":"bracelets","f":"SLIDINGBEADS","k":"pandora"},{"sku":"sliding heart","tipas":"bracelets","f":"SLIDINGHEART","k":"pandora"},{"sku":"star","tipas":"charms","f":"STAR","k":"pandora"},{"sku":"tinkerbell","tipas":"charms","f":"TINKERBELL","k":"pandora"},{"sku":"tinystar","tipas":"earrings","f":"TINYSTAR","k":"pandora"},{"sku":"vader","tipas":"other","f":"VADER","k":"pandora"}]};   /* PUBLISH: data */

/* Products are grouped by what they are, not by which supplier folder they
   came from — the question a colleague actually asks is "do we have earrings". */
const TIPAI = {
  charms: "Charms",
  earrings: "Earrings",
  necklaces: "Necklaces",
  bracelets: "Bracelets",
  rings: "Rings",
  safety: "Safety chains",
  other: "Other",
};
const EILE = ["charms", "earrings", "necklaces", "bracelets", "rings", "safety", "other"];

/* Two catalogues, not one list with a filter: Pandora is a different supplier
   and its range is larger than our own, so mixing them would make "Charms"
   mean two different things at once. The switch decides which catalogue is on
   screen; every count, chip and search below works inside that one only. */
const BRANDAI = [
  // Vadinasi taip pat, kaip užsakymų lentos skirtukas — kolegai ir žmogui
  // Kinijoje tas pats žodis turi reikšti tą patį dalyką.
  ["sava",    "Silver Unbranded", p => p.k !== "pandora"],
  ["pandora", "Pandora",      p => p.k === "pandora"],
];

/* Stock travels inside this file too — a number and a colour written in at
   publish time, refreshed every night. There is still no database key here:
   the page shows what it was given and can reach nothing else. */
/* Red means "will not last", which is not the same as "there are none" — a
   product selling twenty a day is red at 100 pieces. So the number is always
   shown; only a real zero says out of stock. */
const STOCK_LABELS = { g: "in stock", o: "low stock", r: "almost out", n: "" };
/* Red and empty are different answers to "can I sell this today": red still
   has pieces, it just will not have them next week. So they get their own
   chips instead of being lumped together. */
const STOCK_FILTERS = [
  ["all",    "All",         () => true],
  ["have",   "In stock",    p => kiekis(p) > 0],
  ["low",    "Low",         p => p.c === "o"],
  ["almost", "Almost out",  p => p.c === "r" && kiekis(p) > 0],
  ["out",    "Out of stock", p => p.c && p.c !== "n" && kiekis(p) <= 0],
  ["hot",    "Selling fast", p => p.t === "hot"],
];
const kiekis = p => Number(p.s) || 0;

/* Two marks are worth showing and no more. Everything in between is "normal",
   and a page where every tile is badged says nothing at all. */
const ZENKLAI = { hot: ["🔥", "selling fast"], slow: ["💤", "not moving"] };

function zenklasEl(p) {
  const z = ZENKLAI[p.t];
  if (!z) return null;
  const em = document.createElement("em");
  em.className = p.t;
  em.textContent = z[0];
  em.title = z[1];
  return em;
}

const $ = s => document.querySelector(s);
const visosPrekes = DATA.produktai || [];
const turimStock = visosPrekes.some(p => (p.c && p.c !== "n") || p.t);
let brand = BRANDAI[0][0];
const grupe = () => (BRANDAI.find(b => b[0] === brand) || BRANDAI[0])[2];
let items = visosPrekes.filter(grupe());
let kat = "all";
let stockFilter = "all";
let query = "";

function stockOk(p) {
  const f = STOCK_FILTERS.find(x => x[0] === stockFilter);
  return f ? f[2](p) : true;
}

/* A count of 0 and "we never counted this one" look the same if both show a
   dash, so only a real number gets a number — the rest just say nothing. */
function stockEl(p, sarasas) {
  const c = p.c || "n";
  // Uncounted still gets a bar (just a dash) so the tiles stay the same height
  // and the grid does not go ragged. In the lightbox there is nothing to align,
  // so an unknown one says nothing at all.
  if (c === "n" && !sarasas) return null;
  if (c === "n") {
    const tuscia = document.createElement("div");
    tuscia.className = "stock n";
    const dot = document.createElement("i");
    const u = document.createElement("u"); u.textContent = "—";
    tuscia.append(dot, u);
    // How it sells is known from the shipping labels alone, so the mark does
    // not wait for anyone to walk the shelves and count.
    const z = zenklasEl(p);
    if (z) tuscia.appendChild(z);
    return tuscia;
  }
  const box = document.createElement("div");
  box.className = "stock " + c;
  const dot = document.createElement("i");
  box.appendChild(dot);
  const kiek = Number(p.s) || 0;
  if (kiek <= 0) {
    const u = document.createElement("u"); u.textContent = "out of stock";
    box.appendChild(u);
  } else {
    const b = document.createElement("b"); b.textContent = kiek;
    const u = document.createElement("u"); u.textContent = STOCK_LABELS[c];
    box.append(b, u);
  }
  const z = zenklasEl(p);
  if (z) box.appendChild(z);
  return box;
}

/* p.f is the storage file name. For coded products it equals the SKU, but
   themed ones ("Double hoop circle") are stored stripped of spaces, so the
   name shown on the card and the file name are not the same string. */
function faile(p)   { return p.f || String(p.sku).toUpperCase().replace(/[^A-Z0-9-]/g, ""); }
function thumb(p)   { return `${DATA.base}/${faile(p)}.webp`; }
function full(p)    { return `${DATA.base}/big/${faile(p)}.webp`; }

function visible() {
  const q = query.trim().toLowerCase();
  return items.filter(p =>
    (kat === "all" || p.tipas === kat) &&
    stockOk(p) &&
    (!q || p.sku.toLowerCase().includes(q)));
}

function renderStockChips() {
  $("#stockbar").hidden = !turimStock;
  if (!turimStock) return;
  const box = $("#stockchips");
  box.innerHTML = "";
  for (const [key, label, fn] of STOCK_FILTERS) {
    const s = document.createElement("span");
    s.className = "chip" + (stockFilter === key ? " on" : "");
    s.textContent = label;
    if (key !== "all") {
      const u = document.createElement("u");
      u.textContent = items.filter(fn).length;
      s.appendChild(u);
    }
    s.addEventListener("click", () => { stockFilter = key; renderStockChips(); render(); });
    box.appendChild(s);
  }
}

function renderBrandChips() {
  const box = $("#brandchips");
  box.innerHTML = "";
  const rodyti = BRANDAI.filter(([, , fn]) => visosPrekes.some(fn));
  $("#brandbar").hidden = rodyti.length < 2;   // vienas tiekėjas — nėra ką perjungti
  for (const [key, label, fn] of rodyti) {
    const s = document.createElement("span");
    s.className = "chip" + (brand === key ? " on" : "");
    s.textContent = label;
    const u = document.createElement("u");
    u.textContent = visosPrekes.filter(fn).length;
    s.appendChild(u);
    s.addEventListener("click", () => {
      if (brand === key) return;
      brand = key;
      items = visosPrekes.filter(grupe());
      kat = "all";              // tipai kiekviename kataloge savi
      stockFilter = "all";
      renderBrandChips(); renderStockChips(); renderChips(); render();
    });
    box.appendChild(s);
  }
}

function renderChips() {
  const counts = {};
  for (const p of items) counts[p.tipas] = (counts[p.tipas] || 0) + 1;
  const box = $("#chips");
  box.innerHTML = "";
  const list = [["all", "All", items.length]].concat(
    EILE.filter(k => counts[k]).map(k => [k, TIPAI[k], counts[k]]));
  for (const [key, label, n] of list) {
    const s = document.createElement("span");
    s.className = "chip" + (kat === key ? " on" : "");
    s.textContent = label;
    const u = document.createElement("u"); u.textContent = n; s.appendChild(u);
    s.addEventListener("click", () => { kat = key; renderChips(); render(); });
    box.appendChild(s);
  }
}

function render() {
  const list = visible();
  const grid = $("#grid");
  grid.innerHTML = "";
  $("#empty").hidden = list.length > 0;
  $("#count").textContent =
    list.length === items.length
      ? `${items.length} products`
      : `${list.length} of ${items.length} products`;

  for (const p of list) {
    const el = document.createElement("div");
    el.className = "item";

    const st = turimStock ? stockEl(p, true) : null;
    if (st) el.appendChild(st);

    const ph = document.createElement("div");
    ph.className = "ph";
    const img = document.createElement("img");
    img.loading = "lazy";           // 600+ tiles — load them as they scroll in
    img.decoding = "async";
    img.src = thumb(p);
    img.alt = p.sku;
    ph.appendChild(img);

    const cap = document.createElement("div");
    cap.className = "cap";
    const b = document.createElement("b"); b.textContent = p.sku;
    const sp = document.createElement("span"); sp.textContent = TIPAI[p.tipas] || p.tipas;
    cap.appendChild(b); cap.appendChild(sp);

    el.appendChild(ph); el.appendChild(cap);
    el.addEventListener("click", () => openLb(p));
    grid.appendChild(el);
  }
}

function openLb(p) {
  $("#lbimg").src = full(p);
  $("#lbimg").alt = p.sku;
  $("#lbcap").innerHTML = "";
  $("#lbcap").append(p.sku);
  const em = document.createElement("em");
  em.textContent = TIPAI[p.tipas] || p.tipas;
  $("#lbcap").appendChild(em);
  const st = stockEl(p);
  if (st) $("#lbcap").appendChild(st);
  $("#lb").classList.add("on");
}

$("#lb").addEventListener("click", () => $("#lb").classList.remove("on"));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("#lb").classList.remove("on");
});
$("#q").addEventListener("input", e => { query = e.target.value; render(); });

renderBrandChips();
renderChips();
renderStockChips();
render();
</script>
