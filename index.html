<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>China Orders — Live Board</title>
<style>
  :root {
    --bg:#eef1f5; --card:#fff; --ink:#1f2733; --muted:#8a94a6; --line:#e7ebf1;
    --accent:#4f6bed; --accent-soft:#eaeeff;
    --s-ordered:#8a94a6; --s-production:#f5a623; --s-ready:#8e6bd8;
    --s-shipped:#4f6bed; --s-received:#2ecc71; --s-problem:#e5484d;
    --flash:#fff6d5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1a1f27; --ink:#e7ecf3; --muted:#8d97a8;
            --line:#262d38; --accent:#7b90ff; --accent-soft:#232a3d; --flash:#3a3319; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; }
  body {
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.4;
    font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
    padding:20px 16px 90px;
  }
  .wrap { max-width:1800px; margin:0 auto; }

  /* ---- header ---- */
  .top { display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:14px; }
  h1 { font-size:24px; margin:0; letter-spacing:-.3px; }
  .sub { color:var(--muted); font-size:13px; margin-top:4px; display:flex; align-items:center; gap:7px; }
  .pulse { width:8px; height:8px; border-radius:50%; background:var(--s-received); flex:none; }
  .pulse.off { background:var(--s-problem); }
  .pulse.busy { background:var(--s-production); }
  .stats { display:flex; gap:20px; flex-wrap:wrap; }
  .stat b { display:block; font-size:21px; line-height:1.1; }
  .stat span { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.6px; }

  /* ---- tabs ---- */
  .tabs { display:flex; gap:4px; margin:22px 0 0; border-bottom:1px solid var(--line);
          overflow-x:auto; }
  .tab { border:0; background:transparent; color:var(--muted); font-size:15px; font-weight:600;
         white-space:nowrap;
         padding:10px 16px; border-radius:10px 10px 0 0; border-bottom:2px solid transparent;
         margin-bottom:-1px; cursor:pointer; }
  .tab:hover { color:var(--ink); }
  .tab.on { color:var(--accent); border-bottom-color:var(--accent); background:var(--card); }
  .tab u { font-style:normal; text-decoration:none; font-weight:500; opacity:.65; margin-left:6px; }

  /* ---- toolbar ---- */
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:16px 0 14px; }
  input[type=search], select, button, input, textarea {
    font:inherit; color:inherit; border-radius:9px; border:1px solid var(--line);
    background:var(--card); padding:8px 11px; outline:none;
  }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  input[type=search] { min-width:210px; flex:1 1 210px; max-width:340px; }
  button { cursor:pointer; }
  .btn-main { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--muted);
          border-radius:20px; padding:6px 13px; font-size:13px; cursor:pointer; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ---- table ---- */
  .tablewrap { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  thead th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
             color:var(--muted); font-weight:600; padding:11px 10px; border-bottom:1px solid var(--line);
             position:sticky; top:0; background:var(--card); z-index:2; white-space:nowrap; }
  tbody td { padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr.flash { animation:flash 1.6s ease-out; }
  @keyframes flash { from { background:var(--flash); } to { background:transparent; } }
  tbody tr.done { opacity:.5; }
  td input, td textarea, td select { width:100%; border-color:transparent; background:transparent; padding:7px 8px; }
  td input:hover, td textarea:hover, td select:hover { border-color:var(--line); }
  td textarea { resize:vertical; min-height:36px; }
  .mono { font-variant-numeric:tabular-nums; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; }

  /* ---- product photo ----
     One main photo per SKU, served from public storage. Rows whose SKU has no
     photo yet must not leave a hole in the table, so the empty slot keeps the
     same size and just stays grey. */
  .c-photo { width:60px; }
  .pic { width:48px; height:48px; border-radius:8px; background:var(--card);
         overflow:hidden; display:block; border:0; padding:0; cursor:zoom-in; }
  .pic img { width:100%; height:100%; object-fit:cover; display:block; }
  /* Nėra nuotraukos — paliekam tuščią vietą su vos matomu kontūru. Užpildytas
     kvadratas tamsioje temoje atrodo kaip juoda dėmė ir traukia akį labiau
     už pačias prekes. */
  .pic.none { cursor:default; background:transparent;
              border:1px dashed var(--line); }

  .lb { position:fixed; inset:0; background:rgba(10,13,18,.88); display:none;
        align-items:center; justify-content:center; padding:24px; z-index:60; cursor:zoom-out; }
  .lb.on { display:flex; }
  .lb figure { margin:0; text-align:center; max-width:min(760px,100%); }
  .lb img { max-width:100%; max-height:76vh; border-radius:14px; background:#fff; display:block; }
  .lb figcaption { color:#fff; margin-top:12px; font-weight:600;
                   font-family:ui-monospace,Menlo,Consolas,monospace; }

  /* stulpelių pločiai */
  .c-order_date { width:118px; } .c-sku { width:104px; } .c-qty { width:82px; }
  .c-supplier { width:130px; } .c-status { width:142px; } .c-tracking { width:186px; }
  .c-carrier { width:108px; } .c-days { width:56px; text-align:center; }
  .c-size { width:88px; } .c-colour { width:110px; } .c-font { width:118px; } .c-country { width:112px; } .c-delivered { width:96px; }
  .c-del { width:40px; }
  .c-graving textarea { min-width:150px; }
  .c-address textarea { min-width:230px; min-height:52px; }

  td.c-days span { font-size:12px; color:var(--muted); }
  td.c-days span.late { color:#fff; background:var(--s-problem); font-weight:600;
                        border-radius:20px; padding:2px 8px; }
  select.st { font-weight:600; font-size:13px; border-radius:20px; }
  select.st[data-v=ordered]     { color:var(--s-ordered); }
  select.st[data-v=production]  { color:var(--s-production); }
  select.st[data-v=ready]       { color:var(--s-ready); }
  select.st[data-v=shipped]     { color:var(--s-shipped); }
  select.st[data-v=received]    { color:var(--s-received); }
  select.st[data-v=problem]     { color:var(--s-problem); }

  /* delivered jungiklis */
  .sw { display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
  .sw input { position:absolute; opacity:0; width:0; height:0; }
  .sw i { width:38px; height:22px; border-radius:20px; background:var(--line); position:relative;
          transition:background .15s; flex:none; }
  .sw i::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px;
                 border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25);
                 transition:transform .15s; }
  .sw input:checked + i { background:var(--s-received); }
  .sw input:checked + i::after { transform:translateX(16px); }
  .sw input:focus-visible + i { box-shadow:0 0 0 3px var(--accent-soft); }
  .sw b { font-size:12px; font-weight:600; color:var(--muted); }
  .sw input:checked ~ b { color:var(--s-received); }

  .del { border:0; background:transparent; color:var(--muted); font-size:17px; line-height:1; padding:6px; }
  .del:hover { color:var(--s-problem); }
  .empty { padding:44px 20px; text-align:center; color:var(--muted); }

  /* ---- statistika ---- */
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px;
           padding:14px 18px 16px; margin-bottom:14px; }
  .panel-h { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .panel-h strong { font-size:14px; }
  .panel-h .spacer { flex:1; }
  .panel select, .panel input[type=date] { padding:6px 9px; font-size:14px; }
  .big { display:flex; gap:34px; margin:14px 0 4px; }
  .big div b { display:block; font-size:30px; line-height:1.05; font-variant-numeric:tabular-nums; }
  .big div span { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.6px; }
  .mini { width:100%; border-collapse:collapse; margin-top:12px; }
  .mini th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
             color:var(--muted); font-weight:600; padding:4px 8px 6px; border-bottom:1px solid var(--line); }
  .mini td { padding:5px 8px; font-size:14px; border-bottom:1px solid var(--line); }
  .mini tr:last-child td { border-bottom:0; }
  .mini td:first-child { color:var(--muted); white-space:nowrap; width:118px; }
  .mini td.n { text-align:right; font-variant-numeric:tabular-nums; width:80px; }
  .mini .bar-cell { width:auto; padding-right:20px; }
  .mini .bar-fill { height:8px; border-radius:6px; background:var(--accent); min-width:2px; }
  .link-btn { border:0; background:transparent; color:var(--accent); font-size:13px;
              font-weight:600; padding:4px 2px; }

  /* ---- mobile cards ---- */
  @media (max-width:900px) {
    body { padding:16px 10px 90px; }
    .bar { gap:8px; }
    .tabs { overflow-x:auto; }
    .tab { white-space:nowrap; font-size:14px; padding:10px 12px; }
    input[type=search] { flex:1 1 100%; max-width:none; min-width:0; order:-1; }
    /* kortelėmis virsta TIK pagrindinė lenta — statistikos lentelė lieka lentele */
    .tablewrap { border:0; background:transparent; overflow:visible; }
    .tablewrap table, .tablewrap thead, .tablewrap tbody,
    .tablewrap tr, .tablewrap td { display:block; width:auto; min-width:0; }
    .tablewrap thead { display:none; }
    .tablewrap tbody tr { background:var(--card); border:1px solid var(--line); border-radius:14px;
               margin-bottom:12px; padding:6px 12px 10px; }
    /* stulpelių pločiai galioja tik lentelėje — kortelėse viską atstatom */
    .tablewrap tbody td[class] { width:auto; text-align:left; border:0; padding:5px 0;
                      display:flex; align-items:center; gap:10px; }
    .tablewrap tbody td::before { content:attr(data-l); flex:0 0 92px; font-size:11px; text-transform:uppercase;
                       letter-spacing:.5px; color:var(--muted); font-weight:600; }
    .tablewrap td input, .tablewrap td textarea, .tablewrap td select {
                       flex:1 1 auto; width:auto; min-width:0; border-color:var(--line); }
    .tablewrap td input[type=date] { flex:0 0 auto; }
    .panel { padding:12px 14px 14px; }
    .big { gap:22px; }
    .mini td:first-child { width:96px; font-size:13px; }
    .mini td.n { width:56px; }
    .c-graving textarea, .c-address textarea { min-width:0; }
    /* kortelėje nuotrauka stovi viršuje kaip kortelės paveiksliukas */
    .tablewrap tbody td.c-photo::before { content:""; flex:0 0 92px; }
    .pic { width:64px; height:64px; }
    .c-del { justify-content:flex-end; }
    .c-del::before { content:""; flex:1; }
    .del { font-size:20px; padding:8px 10px; }
  }
  .foot { margin-top:16px; color:var(--muted); font-size:12px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1>China Orders</h1>
      <div class="sub"><span class="pulse" id="pulse"></span><span id="syncmsg">connecting…</span></div>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="bar">
    <button class="btn-main" id="add">+ New order</button>
    <input type="search" id="q" placeholder="Search…">
    <div class="chips" id="chips"></div>
    <button id="statsbtn" hidden>Statistics</button>
  </div>

  <div class="panel" id="panel" hidden>
    <div class="panel-h">
      <strong>Orders completed</strong>
      <select id="period">
        <option value="this-week">This week</option>
        <option value="last-week">Last week</option>
        <option value="this-month">This month</option>
        <option value="last-month">Last month</option>
        <option value="last-30">Last 30 days</option>
        <option value="all">All time</option>
        <option value="custom">Choose dates…</option>
      </select>
      <input type="date" id="from" hidden>
      <input type="date" id="to" hidden>
      <span class="spacer"></span>
      <button class="link-btn" id="bmode">show months</button>
    </div>

    <div class="big">
      <div><b id="p-orders">0</b><span>orders</span></div>
      <div><b id="p-pieces">0</b><span>pieces</span></div>
      <div><b id="p-open">0</b><span>still to make</span></div>
    </div>

    <table class="mini">
      <thead><tr><th id="bhead">Week</th><th></th><th class="n">Orders</th><th class="n">Pieces</th></tr></thead>
      <tbody id="breakdown"></tbody>
    </table>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No orders yet — press “+ New order”.</div>
  </div>

  <div class="foot">Everything you type saves automatically and appears on the other person’s screen within a few seconds.</div>
</div>

<div class="lb" id="lb"><figure><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption></figure></div>

<script>
/* ---------------------------------------------------------------
   Config travels in the link itself (the part after #), not in this
   file — so the page can sit in a public place while the board stays
   reachable only to whoever was given the full link. The first visit
   remembers it, so later visits work from a plain bookmark too.
   Without config the page runs as a local demo (this browser only).
----------------------------------------------------------------*/
function readCfg(name, store) {
  const fromLink = new URLSearchParams(location.hash.replace(/^#/, "")).get(name);
  try {
    if (fromLink) { localStorage.setItem(store, fromLink); return fromLink; }
    return localStorage.getItem(store) || "";
  } catch (e) { return fromLink || ""; }
}
const SUPABASE_URL = readCfg("u", "board_url");
const SUPABASE_KEY = readCfg("k", "board_key");
const DEMO = !SUPABASE_URL || !SUPABASE_KEY;
const POLL_MS = 4000;

/* ---------------------------------------------------------------
   Four boards on one page, holding two different kinds of work.

   Silver unbranded, Pandora and Pearl Jewellery are the same job —
   bulk stock coming from the factory — so they share one table and
   the same columns, and differ only by which product line the row
   belongs to. Splitting them into tabs keeps each product line's
   list short enough to read at a glance.

   Personalised is a different job — one-off engraved orders going to
   a named customer — so it keeps its own columns and its own table
   instead of one table with half-empty rows.
----------------------------------------------------------------*/
const STATUSES = [
  ["ordered","Ordered"], ["production","In production"], ["ready","Ready"],
  ["shipped","Shipped"], ["received","Received"], ["problem","Problem"],
];
const hasTracking = r => !!(r.tracking || "").trim();

// One product line of factory stock. `category` is both the tab it shows up in
// and the value written to every row, so rows can never land in the wrong tab.
// `ship` — this product line is sent straight to the buyer, so it also needs
// colour, address and country, the same way the Personalised tab has them.
function bulkView(label, category, opts) {
  const ship = !!(opts && opts.ship);
  return {
    label,
    table: "orders",
    category,
    search: ship ? "Search SKU, tracking, address…" : "Search SKU, tracking…",
    cols: [
      { key:"photo",      label:"",           kind:"photo" },
      { key:"order_date", label:"Order date", type:"date", cls:"mono" },
      { key:"sku",        label:"SKU",        cls:"mono", ph:"KTE092" },
      // Size lives in its own column so the SKU stays a clean code — that is
      // also what the product photo is looked up by.
      // Užuomina trumpa ir bendrinė: konkretus pavyzdys („18CM") tuščiuose
      // langeliuose atrodo kaip įrašyta reikšmė ir klaidina.
      { key:"size",       label:"Size",       cls:"mono", ph:"size" },
      ...(ship ? [{ key:"colour", label:"Colour", ph:"colour" }] : []),
      { key:"qty",        label:"Qty",        type:"number", cls:"mono", num:true },
      ...(ship ? [
      { key:"address",    label:"Address & phone number", tag:"textarea", ph:"full address + phone number" },
      { key:"country",    label:"Country",    ph:"country" },
      ] : []),
      { key:"status",     label:"Status",     kind:"status" },
      { key:"tracking",   label:"Tracking no.", cls:"mono", ph:"tracking number" },
      { key:"carrier",    label:"Carrier",    ph:"carrier" },
      { key:"days",       label:"Days",       kind:"days" },
      { key:"note",       label:"Notes",      tag:"textarea", ph:"notes" },
    ],
    blank: () => ({ order_date: today(), sku:"", size:"", qty:null, category,
                    status:"ordered", tracking:"", carrier:"", note:"",
                    ...(ship ? { colour:"", address:"", country:"" } : {}) }),
    done: r => r.status === "received",
    stats: [
      { label:"Open",          fn: r => r.status !== "received" },
      { label:"In production", fn: r => r.status === "production" },
      { label:"Shipped",       fn: r => r.status === "shipped" },
      { label:"Received",      fn: r => r.status === "received" },
      { label:"Problems",      fn: r => r.status === "problem" },
    ],
    filters: [
      { key:"active",   label:"Active",   fn: r => r.status !== "received" },
      { key:"all",      label:"All",      fn: () => true },
      { key:"shipped",  label:"Shipped",  fn: r => r.status === "shipped" },
      { key:"received", label:"Received", fn: r => r.status === "received" },
      { key:"problem",  label:"Problems", fn: r => r.status === "problem" },
    ],
  };
}

const VIEWS = {
  silver:  bulkView("Silver unbranded", "silver"),
  pandora: bulkView("Pandora",          "pandora"),
  pearl:   bulkView("Pearl Jewellery",  "pearl",         { ship:true }),
  bd:      bulkView("B/D Modian Silver Sterling", "bd",   { ship:true }),
  ac:      bulkView("A/C Modian Silver Sterling", "ac",   { ship:true }),

  personalised: {
    label: "Personalised",
    table: "personalised_orders",
    search: "Search SKU, engraving, address, tracking…",
    analytics: true,   // how much was finished per week / per month
    cols: [
      { key:"photo",      label:"",           kind:"photo" },
      { key:"order_date", label:"Order date", type:"date", cls:"mono" },
      { key:"sku",        label:"SKU",        cls:"mono", ph:"KTE092" },
      { key:"font",       label:"Font",       ph:"font name" },
      { key:"colour",     label:"Colour",     ph:"colour" },
      { key:"graving",    label:"Graving",    tag:"textarea", ph:"text to engrave" },
      { key:"qty",        label:"Qty",        type:"number", cls:"mono", num:true },
      { key:"address",    label:"Address & phone number", tag:"textarea", ph:"full address + phone number" },
      { key:"country",    label:"Country",    ph:"country" },
      { key:"tracking",   label:"Tracking code", cls:"mono", ph:"tracking code" },
      { key:"delivered",  label:"Delivered",  kind:"switch" },
      { key:"note",       label:"Notes",      tag:"textarea", ph:"notes" },
    ],
    blank: () => ({ order_date: today(), sku:"", font:"", colour:"", graving:"", qty:null,
                    address:"", country:"", tracking:"", delivered:false, note:"" }),
    done: r => !!r.delivered,
    stats: [
      { label:"Orders",    fn: () => true },
      { label:"To make",   fn: r => !r.delivered && !hasTracking(r) },
      { label:"Shipped",   fn: r => !r.delivered && hasTracking(r) },
      { label:"Delivered", fn: r => !!r.delivered },
    ],
    filters: [
      { key:"active", label:"Active",    fn: r => !r.delivered },
      { key:"make",   label:"To make",   fn: r => !r.delivered && !hasTracking(r) },
      { key:"ship",   label:"Shipped",   fn: r => !r.delivered && hasTracking(r) },
      { key:"done",   label:"Delivered", fn: r => !!r.delivered },
      { key:"all",    label:"All",       fn: () => true },
    ],
  },
};

let viewKey = (() => {
  try { return VIEWS[localStorage.getItem("board_view")] ? localStorage.getItem("board_view") : "silver"; }
  catch (e) { return "silver"; }
})();
let view = VIEWS[viewKey];
let rows = [];            // server truth for the open tab
let counts = {};          // tab -> how many rows, for the tab labels
let filter = view.filters[0].key;
let query = "";
let editing = null;       // id:field currently focused — never overwritten by a poll
let pending = new Map();  // id -> {field:value} not yet confirmed by the server

/* ---------------- storage layer ---------------- */
const api = {
  headers(extra) {
    return Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
    }, extra || {});
  },
  // Every call takes the whole view (table + product line), because three tabs
  // now live in the same table and must never see each other's rows.
  demoKey(v) { return "demo_" + v.table + (v.category ? "_" + v.category : ""); },
  where(v) { return v.category ? `&category=eq.${encodeURIComponent(v.category)}` : ""; },
  async list(v) {
    if (DEMO) return JSON.parse(localStorage.getItem(api.demoKey(v)) || "[]");
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${v.table}?select=*${api.where(v)}` +
                          `&order=order_date.desc,created_at.desc`,
                          { headers: api.headers(), cache: "no-store" });
    if (!r.ok) throw new Error("load " + r.status);
    return r.json();
  },
  async insert(v, row) {
    if (DEMO) { const a = await api.list(v); a.unshift(row);
                localStorage.setItem(api.demoKey(v), JSON.stringify(a)); return row; }
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${v.table}`, {
      method: "POST", headers: api.headers({ "Prefer": "return=representation" }), body: JSON.stringify(row) });
    if (!r.ok) throw new Error("insert " + r.status);
    return (await r.json())[0];
  },
  async patch(v, id, patch) {
    if (DEMO) { const a = await api.list(v); const i = a.findIndex(x => x.id === id);
                if (i > -1) Object.assign(a[i], patch);
                localStorage.setItem(api.demoKey(v), JSON.stringify(a)); return; }
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${v.table}?id=eq.${encodeURIComponent(id)}`, {
      method: "PATCH", headers: api.headers({ "Prefer": "return=minimal" }), body: JSON.stringify(patch) });
    if (!r.ok) throw new Error("save " + r.status);
  },
  async remove(v, id) {
    if (DEMO) { const a = (await api.list(v)).filter(x => x.id !== id);
                localStorage.setItem(api.demoKey(v), JSON.stringify(a)); return; }
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${v.table}?id=eq.${encodeURIComponent(id)}`, {
      method: "DELETE", headers: api.headers({ "Prefer": "return=minimal" }) });
    if (!r.ok) throw new Error("delete " + r.status);
  },
};

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
function today() { return new Date().toISOString().slice(0, 10); }
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0, v = c === "x" ? r : (r & 0x3 | 0x8); return v.toString(16); });
}
function daysSince(d) {
  if (!d) return "";
  const ms = Date.now() - new Date(d + "T00:00:00").getTime();
  return Math.max(0, Math.floor(ms / 86400000));
}
function setSync(state, msg) {
  $("#pulse").className = "pulse" + (state ? " " + state : "");
  $("#syncmsg").textContent = msg;
}

/* ---------------- chrome (tabs, head, filters, stats) ---------------- */
function renderTabs() {
  const box = $("#tabs");
  box.innerHTML = "";
  for (const [key, v] of Object.entries(VIEWS)) {
    const b = document.createElement("button");
    b.className = "tab" + (key === viewKey ? " on" : "");
    b.textContent = v.label;
    if (counts[key] != null) {
      const u = document.createElement("u");
      u.textContent = counts[key];
      b.appendChild(u);
    }
    b.addEventListener("click", () => switchView(key));
    box.appendChild(b);
  }
}

function renderHead() {
  const tr = $("#head");
  tr.innerHTML = "";
  for (const c of view.cols) {
    const th = document.createElement("th");
    th.className = "c-" + c.key;
    th.textContent = c.label;
    tr.appendChild(th);
  }
  const th = document.createElement("th");
  th.className = "c-del";
  tr.appendChild(th);
}

function renderChips() {
  const box = $("#chips");
  box.innerHTML = "";
  for (const f of view.filters) {
    const s = document.createElement("span");
    s.className = "chip" + (f.key === filter ? " on" : "");
    s.textContent = f.label;
    s.addEventListener("click", () => { filter = f.key; renderChips(); render(); });
    box.appendChild(s);
  }
}

function renderStats() {
  const box = $("#stats");
  box.innerHTML = "";
  for (const s of view.stats) {
    const d = document.createElement("div");
    d.className = "stat";
    const b = document.createElement("b");
    b.textContent = rows.filter(s.fn).length;
    const sp = document.createElement("span");
    sp.textContent = s.label;
    d.appendChild(b); d.appendChild(sp);
    box.appendChild(d);
  }
}

/* ---------------- rows ---------------- */
function visible() {
  const q = query.trim().toLowerCase();
  const f = view.filters.find(x => x.key === filter) || view.filters[0];
  // `days` and `photo` are drawn, not stored — searching them would compare
  // against undefined on every row.
  const keys = view.cols.map(c => c.key).filter(k => k !== "days" && k !== "photo");
  return rows.filter(r => {
    if (!f.fn(r)) return false;
    if (!q) return true;
    return keys.some(k => String(r[k] == null ? "" : r[k]).toLowerCase().includes(q));
  });
}

function cellInput(r, col) {
  const el = document.createElement(col.tag || "input");
  if (col.type) el.type = col.type;
  if (col.cls) el.className = col.cls;
  if (col.ph) el.placeholder = col.ph;
  el.value = r[col.key] == null ? "" : r[col.key];
  el.addEventListener("focus", () => { editing = r.id + ":" + col.key; });
  el.addEventListener("blur",  () => { if (editing === r.id + ":" + col.key) editing = null; });
  el.addEventListener("change", () =>
    save(r.id, col.key, col.num ? (el.value === "" ? null : Number(el.value)) : el.value));
  return el;
}

function statusCell(r) {
  const sel = document.createElement("select");
  sel.className = "st";
  for (const [v, label] of STATUSES) {
    const o = document.createElement("option"); o.value = v; o.textContent = label; sel.appendChild(o);
  }
  sel.value = r.status || "ordered";
  sel.dataset.v = sel.value;
  sel.addEventListener("focus", () => { editing = r.id + ":status"; });
  sel.addEventListener("blur",  () => { if (editing === r.id + ":status") editing = null; });
  sel.addEventListener("change", () => { sel.dataset.v = sel.value; save(r.id, "status", sel.value); });
  return sel;
}

function switchCell(r, key) {
  const sw = document.createElement("label");
  sw.className = "sw";
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = !!r[key];
  const knob = document.createElement("i");
  const lab = document.createElement("b");
  lab.textContent = r[key] ? "yes" : "no";
  cb.addEventListener("change", () => { lab.textContent = cb.checked ? "yes" : "no"; save(r.id, key, cb.checked); });
  sw.appendChild(cb); sw.appendChild(knob); sw.appendChild(lab);
  return sw;
}

/* One main photo per SKU, uploaded by katalogas.py and served straight from
   public storage. The file name IS the SKU, so no lookup table is needed —
   a row typed in China shows its photo the moment the code is spelled right.
   Missing photo is normal (new item, typo), so it fails quietly to grey. */
/* A row may name a variant the catalogue keeps under its base code — a ring
   size ("KTR144 S-8") or a plating suffix. So we try the exact code first and
   fall back to the base one, rather than showing an empty box. */
/* Where the code ends and the variant begins is written right there: the space.
   "KTB005 20CM" is item KTB005 in size 20cm, "KTR144 S-8" is KTR144 in size 8.
   So we split on the space FIRST — stripping it away would glue the size onto
   the digits (KTB00520CM) and leave nothing to go on. */
function photoNames(sku) {
  const raw = String(sku || "").toUpperCase().trim();
  const svarus = s => s.replace(/[^A-Z0-9-]/g, "");
  const kand = [];
  for (const v of [svarus(raw), svarus(raw.split(/\s+/)[0])]) {
    if (v && !kand.includes(v)) kand.push(v);
  }
  // Ir tas pats be dangos priesagos gale („KTC165-A" → „KTC165").
  const be_variantu = (kand[kand.length - 1] || "").replace(/-[A-Z]{1,3}\d?$/, "");
  if (be_variantu && !kand.includes(be_variantu)) kand.push(be_variantu);
  return kand;
}

function photoUrl(name, big) {
  if (!name || !SUPABASE_URL) return "";
  return `${SUPABASE_URL}/storage/v1/object/public/produktai/${big ? "big/" : ""}${name}.webp`;
}

function photoCell(r) {
  const box = document.createElement("button");
  box.className = "pic none";
  box.type = "button";
  const vardai = photoNames(r.sku);
  if (!vardai.length || !SUPABASE_URL) return box;

  const img = document.createElement("img");
  img.loading = "lazy";
  img.decoding = "async";
  img.alt = r.sku || "";
  let bandymas = 0;
  img.addEventListener("load", () => {
    box.classList.remove("none");
    box.dataset.name = vardai[bandymas];
  });
  img.addEventListener("error", () => {
    bandymas += 1;
    if (bandymas < vardai.length) img.src = photoUrl(vardai[bandymas], false);
    else img.remove();
  });
  img.src = photoUrl(vardai[0], false);
  box.appendChild(img);
  box.addEventListener("click", () => {
    if (box.classList.contains("none")) return;
    openPhoto(box.dataset.name, r.sku);
  });
  return box;
}

function openPhoto(name, sku) {
  $("#lbimg").src = photoUrl(name, true);
  $("#lbimg").alt = sku || "";
  $("#lbcap").textContent = sku || "";
  $("#lb").classList.add("on");
}

function daysCell(r) {
  const span = document.createElement("span");
  const n = daysSince(r.order_date);
  span.textContent = (view.done(r) || n === "") ? "—" : n + "d";
  if (n !== "" && n > 30 && !view.done(r)) span.className = "late";
  return span;
}

function render() {
  const list = visible();
  const tb = $("#rows");
  tb.innerHTML = "";
  $("#empty").hidden = list.length > 0;

  for (const r of list) {
    const tr = document.createElement("tr");
    tr.dataset.id = r.id;
    if (view.done(r)) tr.classList.add("done");

    for (const col of view.cols) {
      const td = document.createElement("td");
      td.className = "c-" + col.key;
      td.dataset.l = col.label;
      if (col.kind === "status")      td.appendChild(statusCell(r));
      else if (col.kind === "switch") td.appendChild(switchCell(r, col.key));
      else if (col.kind === "photo")  td.appendChild(photoCell(r));
      else if (col.kind === "days")   td.appendChild(daysCell(r));
      else                            td.appendChild(cellInput(r, col));
      tr.appendChild(td);
    }

    const tdDel = document.createElement("td");
    tdDel.className = "c-del"; tdDel.dataset.l = "";
    const del = document.createElement("button");
    del.className = "del"; del.title = "Delete"; del.textContent = "✕";
    del.addEventListener("click", () => removeRow(r));
    tdDel.appendChild(del);
    tr.appendChild(tdDel);

    tb.appendChild(tr);
  }
  renderStats();
  renderPanel();
}

function flash(id) {
  const tr = document.querySelector(`tr[data-id="${id}"]`);
  if (tr) { tr.classList.remove("flash"); void tr.offsetWidth; tr.classList.add("flash"); }
}

/* ---------------- writes ---------------- */
async function save(id, field, value) {
  const row = rows.find(r => r.id === id);
  const patch = { [field]: value };

  // Stamp the day the work was finished the first time it is marked shipped or
  // delivered — otherwise the weekly numbers would only know when an order came in.
  if (view.analytics && row && !row.done_date &&
      ((field === "tracking" && String(value || "").trim()) ||
       (field === "delivered" && value === true))) {
    patch.done_date = today();
  }

  if (row) Object.assign(row, patch);
  const p = pending.get(id) || {};
  Object.assign(p, patch);
  pending.set(id, p);
  renderStats();
  renderPanel();
  const v = view;                       // remember the tab the edit belongs to
  try {
    setSync("busy", "saving…");
    await api.patch(v, id, Object.assign({ updated_at: new Date().toISOString() }, patch));
    const cur = pending.get(id);
    if (cur) {
      for (const k of Object.keys(patch)) delete cur[k];
      if (!Object.keys(cur).length) pending.delete(id);
    }
    setSync("", "saved · live");
  } catch (e) {
    setSync("off", "not saved — check connection, then retype");
  }
}

async function addRow() {
  const row = Object.assign({ id: uuid(), created_at: new Date().toISOString(),
                              updated_at: new Date().toISOString() }, view.blank());
  const v = view;
  rows.unshift(row);
  render();
  const first = document.querySelector(`tr[data-id="${row.id}"] .c-sku input`);
  if (first) first.focus();
  try { await api.insert(v, row); setSync("", "saved · live"); }
  catch (e) { setSync("off", "could not create the row — reload the page"); }
}

async function removeRow(r) {
  const what = r.sku || r.graving || r.product || "this order";
  if (!confirm(`Delete ${what}?`)) return;
  const v = view;
  rows = rows.filter(x => x.id !== r.id);
  render();
  try { await api.remove(v, r.id); } catch (e) { setSync("off", "delete failed — reload the page"); }
}

/* ---------------- statistics ----------------
   Counts an order in the week it was finished (done_date), not the week it
   arrived — that is the number you get paid on and plan capacity with.
   Orders finished before this column existed simply fall back to their order date.
------------------------------------------------*/
let period = "this-week";
let breakdownMode = "weeks";
let panelOpen = (() => { try { return localStorage.getItem("board_stats") !== "0"; } catch (e) { return true; } })();

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
function parseDay(s) { return s ? new Date(String(s).slice(0, 10) + "T00:00:00") : null; }
function startOfWeek(d) {                       // Monday
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function weekLabel(mon) {
  const sun = addDays(mon, 6);
  const a = `${MONTHS[mon.getMonth()]} ${mon.getDate()}`;
  const b = mon.getMonth() === sun.getMonth() ? `${sun.getDate()}` : `${MONTHS[sun.getMonth()]} ${sun.getDate()}`;
  return `${a}–${b}`;
}
const doneDay = r => r.done_date || ((r.delivered || hasTracking(r)) ? r.order_date : null);

function periodRange() {
  const now = new Date(); now.setHours(0,0,0,0);
  if (period === "this-week")  { const m = startOfWeek(now); return [m, addDays(m, 6)]; }
  if (period === "last-week")  { const m = addDays(startOfWeek(now), -7); return [m, addDays(m, 6)]; }
  if (period === "this-month") { return [new Date(now.getFullYear(), now.getMonth(), 1),
                                         new Date(now.getFullYear(), now.getMonth() + 1, 0)]; }
  if (period === "last-month") { return [new Date(now.getFullYear(), now.getMonth() - 1, 1),
                                         new Date(now.getFullYear(), now.getMonth(), 0)]; }
  if (period === "last-30")    { return [addDays(now, -29), now]; }
  if (period === "custom") {
    const f = parseDay($("#from").value), t = parseDay($("#to").value);
    return [f || new Date(2000, 0, 1), t || now];
  }
  return [new Date(2000, 0, 1), new Date(2999, 0, 1)];
}

const pieces = list => list.reduce((s, r) => s + (Number(r.qty) > 0 ? Number(r.qty) : 1), 0);

function renderPanel() {
  const show = !!view.analytics;
  $("#statsbtn").hidden = !show;
  $("#panel").hidden = !(show && panelOpen);
  if (!show || !panelOpen) return;

  $("#statsbtn").textContent = "Hide statistics";
  const custom = period === "custom";
  $("#from").hidden = !custom;
  $("#to").hidden = !custom;

  const [from, to] = periodRange();
  const inRange = rows.filter(r => {
    const d = parseDay(doneDay(r));
    return d && d >= from && d <= to;
  });

  $("#p-orders").textContent = inRange.length;
  $("#p-pieces").textContent = pieces(inRange);
  $("#p-open").textContent   = rows.filter(r => !r.delivered && !hasTracking(r)).length;

  // breakdown: last 8 weeks or last 6 months
  const now = new Date(); now.setHours(0,0,0,0);
  const buckets = [];
  if (breakdownMode === "weeks") {
    let m = startOfWeek(now);
    for (let i = 0; i < 8; i++) { buckets.push({ label: weekLabel(m), from: m, to: addDays(m, 6) }); m = addDays(m, -7); }
  } else {
    for (let i = 0; i < 6; i++) {
      const f = new Date(now.getFullYear(), now.getMonth() - i, 1);
      buckets.push({ label: `${MONTHS[f.getMonth()]} ${f.getFullYear()}`,
                     from: f, to: new Date(f.getFullYear(), f.getMonth() + 1, 0) });
    }
  }
  for (const b of buckets) {
    b.list = rows.filter(r => { const d = parseDay(doneDay(r)); return d && d >= b.from && d <= b.to; });
  }
  const max = Math.max(1, ...buckets.map(b => b.list.length));

  const tb = $("#breakdown");
  tb.innerHTML = "";
  for (const b of buckets) {
    const tr = document.createElement("tr");
    const c1 = document.createElement("td"); c1.textContent = b.label;
    const c2 = document.createElement("td"); c2.className = "bar-cell";
    const fill = document.createElement("div");
    fill.className = "bar-fill";
    fill.style.width = Math.round((b.list.length / max) * 100) + "%";
    if (!b.list.length) fill.style.opacity = ".25";
    c2.appendChild(fill);
    const c3 = document.createElement("td"); c3.className = "n"; c3.textContent = b.list.length;
    const c4 = document.createElement("td"); c4.className = "n"; c4.textContent = pieces(b.list);
    tr.append(c1, c2, c3, c4);
    tb.appendChild(tr);
  }
  $("#bhead").textContent = breakdownMode === "weeks" ? "Week" : "Month";
  $("#bmode").textContent = breakdownMode === "weeks" ? "show months" : "show weeks";
}

/* ---------------- view switching ---------------- */
function switchView(key) {
  if (key === viewKey || !VIEWS[key]) return;
  viewKey = key;
  view = VIEWS[key];
  try { localStorage.setItem("board_view", key); } catch (e) {}
  rows = [];
  pending = new Map();
  editing = null;
  filter = view.filters[0].key;
  $("#q").placeholder = view.search;
  renderTabs(); renderHead(); renderChips(); render();
  setSync("busy", "loading…");
  sync();
}

/* ---------------- polling ---------------- */
async function sync() {
  const v = view;
  try {
    const fresh = await api.list(v);
    if (v !== view) return;               // tab switched mid-request
    const before = new Map(rows.map(r => [r.id, JSON.stringify(r)]));

    // keep local edits that the server hasn't confirmed yet
    for (const r of fresh) {
      const p = pending.get(r.id);
      if (p) Object.assign(r, p);
    }
    const freshIds = new Set(fresh.map(r => r.id));
    for (const r of rows) if (!freshIds.has(r.id) && pending.has(r.id)) fresh.unshift(r);

    const changed = fresh.filter(r => before.has(r.id) && before.get(r.id) !== JSON.stringify(r)).map(r => r.id);
    const added = fresh.filter(r => !before.has(r.id)).map(r => r.id);
    const sameCount = fresh.length === rows.length;

    rows = fresh;
    counts[viewKey] = fresh.length;
    // re-rendering steals focus, so skip it while someone is typing in a cell
    if (!editing) {
      render();
      renderTabs();
      if (before.size) [...changed, ...added].forEach(flash);
    } else if (!sameCount || changed.length) {
      renderStats();
    }
    if (!editing) setSync("", DEMO ? "demo mode — not connected to the shared board" : "live · synced");
  } catch (e) {
    setSync("off", "offline — retrying");
  }
}

// the other tabs' counters, so the labels are honest without opening them
async function syncCounts() {
  for (const [key, v] of Object.entries(VIEWS)) {
    if (key === viewKey) continue;
    try { counts[key] = (await api.list(v)).length; } catch (e) {}
  }
  if (!editing) renderTabs();
}

/* ---------------- wire up ---------------- */
$("#add").addEventListener("click", addRow);
$("#q").addEventListener("input", e => { query = e.target.value; if (!editing) render(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });

$("#period").addEventListener("change", e => {
  period = e.target.value;
  if (period === "custom" && !$("#from").value) {
    const now = new Date();
    $("#from").value = iso(new Date(now.getFullYear(), now.getMonth(), 1));
    $("#to").value = iso(now);
  }
  renderPanel();
});
$("#from").addEventListener("change", renderPanel);
$("#to").addEventListener("change", renderPanel);
$("#bmode").addEventListener("click", () => {
  breakdownMode = breakdownMode === "weeks" ? "months" : "weeks";
  renderPanel();
});
$("#statsbtn").addEventListener("click", () => {
  panelOpen = !panelOpen;
  try { localStorage.setItem("board_stats", panelOpen ? "1" : "0"); } catch (e) {}
  $("#statsbtn").textContent = panelOpen ? "Hide statistics" : "Statistics";
  renderPanel();
});

$("#lb").addEventListener("click", () => $("#lb").classList.remove("on"));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("#lb").classList.remove("on");
});

$("#q").placeholder = view.search;
renderTabs(); renderHead(); renderChips(); render();
sync();
syncCounts();
setInterval(sync, POLL_MS);
setInterval(syncCounts, POLL_MS * 5);
</script>
</body>
</html>
